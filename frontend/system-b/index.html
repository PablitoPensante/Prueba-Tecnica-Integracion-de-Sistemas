<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema B · Firma documental</title><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/modal.css"><script src="/app.js" defer></script></head><body><main class="shell"><header class="topbar"><div class="brand"><span class="mark">B</span><div><h1>Firma documental</h1><p>Sistema B · Revisión y decisión</p></div></div><a class="system-link" href="http://localhost:3000">← Ir al Sistema A</a></header><section class="metrics"><div class="metric"><span>Solicitudes</span><strong id="total">0</strong></div><div class="metric"><span>Pendientes</span><strong id="pending">0</strong></div><div class="metric"><span>Resueltas</span><strong id="resolved">0</strong></div></section><section class="panel"><h2>Solicitudes recibidas</h2><div id="notice"></div><div id="list" class="list"></div></section></main><dialog id="rejectDialog"><form id="rejectForm"><header class="modal-head"><h2>Rechazar documento</h2><button class="close" type="button" id="closeDialog" aria-label="Cerrar">×</button></header><div class="modal-body"><p class="modal-copy">Explica brevemente por qué el documento no puede aprobarse.</p><div class="field"><label for="reason">Motivo del rechazo</label><textarea id="reason" maxlength="300" placeholder="Ejemplo: falta la firma del representante…" required></textarea><span class="counter"><span id="count">0</span>/300</span></div><div class="modal-actions"><button class="secondary" type="button" id="cancelReject">Cancelar</button><button class="danger" type="submit">Confirmar rechazo</button></div></div></form></dialog></body></html>
