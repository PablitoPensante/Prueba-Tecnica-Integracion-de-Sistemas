services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: absign
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - absign_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d absign"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  absign_postgres_data:
